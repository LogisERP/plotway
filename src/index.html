<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Plotway — Private Land & Property Inventory Management for Real-Estate Brokers">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Plotway</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

  <!-- App Styles -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <!-- Ionic App Shell -->
  <ion-app id="app">
    <!-- Ionic Header -->
    <ion-header id="app-header" class="ion-no-border">
      <ion-toolbar color="dark">
        <ion-buttons slot="start">
          <ion-button id="header-back-btn" class="hidden" aria-label="Go back">
            <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
        <ion-title id="header-title">Plotway</ion-title>
        <ion-buttons slot="end">
          <ion-button id="header-search-btn" aria-label="Search">
            <ion-icon name="search-outline" slot="icon-only"></ion-icon>
          </ion-button>
          <ion-button id="header-filter-btn" class="hidden" aria-label="Filter">
            <ion-icon name="funnel-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <!-- Connection Status Bar -->
    <div id="connection-bar" class="connection-bar hidden">
      <span id="connection-text">You are offline</span>
    </div>

    <!-- Main Ionic Content Area -->
    <ion-content class="ion-padding" id="app-content">
      <!-- Pages rendered here by router -->
    </ion-content>

    <!-- Ionic Floating Action Button -->
    <ion-fab vertical="bottom" horizontal="end" slot="fixed" id="fab-container">
      <ion-fab-button id="fab" color="primary" class="hidden">
        <ion-icon name="add-outline"></ion-icon>
      </ion-fab-button>
    </ion-fab>

    <!-- Ionic Bottom Navigation / Tab Bar -->
    <ion-tab-bar slot="bottom" id="bottom-nav">
      <ion-tab-button tab="dashboard" class="nav-item active" data-page="dashboard" id="nav-dashboard">
        <ion-icon name="grid-outline"></ion-icon>
        <ion-label>Dashboard</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="inventory" class="nav-item" data-page="inventory" id="nav-inventory">
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>Inventory</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="buyers" class="nav-item" data-page="buyers" id="nav-buyers">
        <ion-icon name="people-outline"></ion-icon>
        <ion-label>Buyers</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="leads" class="nav-item" data-page="leads" id="nav-leads">
        <ion-icon name="call-outline"></ion-icon>
        <ion-label>Leads</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="more" class="nav-item" data-page="more" id="nav-more">
        <ion-icon name="ellipsis-horizontal-outline"></ion-icon>
        <ion-label>More</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-app>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal Container -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- Bottom Sheet Container -->
  <div id="bottom-sheet-overlay" class="bottom-sheet-overlay hidden">
    <div id="bottom-sheet" class="bottom-sheet">
      <div class="bottom-sheet-handle"></div>
      <div id="bottom-sheet-content" class="bottom-sheet-content"></div>
    </div>
  </div>

  <!-- Filter Drawer -->
  <div id="filter-overlay" class="filter-overlay hidden">
    <div id="filter-drawer" class="filter-drawer">
      <div class="filter-header">
        <h2>Filters</h2>
        <button id="filter-close-btn" class="header-btn" aria-label="Close filters">
          <ion-icon name="close-outline" style="font-size: 24px;"></ion-icon>
        </button>
      </div>
      <div id="filter-body" class="filter-body"></div>
      <div class="filter-footer">
        <button id="filter-reset-btn" class="btn btn-outline">Reset</button>
        <button id="filter-apply-btn" class="btn btn-primary">Apply Filters</button>
      </div>
    </div>
  </div>

  <!-- Search Overlay -->
  <div id="search-overlay" class="search-overlay hidden">
    <div class="search-header">
      <button id="search-back-btn" class="header-btn" aria-label="Close search">
        <ion-icon name="arrow-back-outline" style="font-size: 24px;"></ion-icon>
      </button>
      <input type="text" id="search-input" class="search-input" placeholder="Search properties, buyers, leads..." autocomplete="off">
      <button id="search-clear-btn" class="header-btn hidden" aria-label="Clear search">
        <ion-icon name="close-outline" style="font-size: 24px;"></ion-icon>
      </button>
    </div>
    <div id="search-results" class="search-results"></div>
  </div>

  <!-- App Script -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
